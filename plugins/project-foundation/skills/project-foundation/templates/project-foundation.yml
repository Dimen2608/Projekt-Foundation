# Maschinenlesbarer Index der Foundation.
#
# WICHTIG: Diese Datei ist ein INDEX, niemals die Source of Truth.
# Bei Widersprüchen gewinnen immer die Dokumente (STATUS.md, docs/*).
#
# Kopieren nach .project-foundation.yml im Projektwurzelverzeichnis.
#
# Hier steht nur, was ein Werkzeug braucht und nirgends sonst maschinenlesbar
# ablesen kann. Alles, was schon in docs/ steht, gehört ausdrücklich NICHT hierher:
# eine zweite Fassung driftet, und dann muss jemand entscheiden, welche stimmt.

# --- Pflicht ---------------------------------------------------------------

schema_version: 1

foundation:
  # Ergebnis des vollständigen Foundation-Prozesses (Review + Entscheidung),
  # nicht die Ausgabe des Validators. Der prüft nur, ob diese Angabe zu
  # STATUS.md und blocking_issues passt.
  status: <READY | NOT_READY>
  # Optional. Muss zu status passen: READY mit offenen Blockern ist ein Widerspruch.
  blocking_issues: 0

# --- Optional: wird geprüft, wenn vorhanden --------------------------------

# project.name taucht in Reports und Werkzeugen auf, sonst nichts.
project:
  name: <projektname>

# Behauptungen über vorhandene Agent-Dateien. Stimmen sie nicht, ist das ein
# Blocker - ein Index, der lügt, ist schlechter als keiner.
ai_support:
  claude_md: true
  agents_md: false
  cursor_rules: false

testing:
  # Nur Level nennen, die tatsächlich aktiv sind.
  levels: [unit]
  # Pflicht, sobald levels nicht leer ist - ein Test-Level ohne
  # ausführbaren Command ist keine Teststrategie.
  command: <z. B. pytest>

# Weitere Schlüssel sind erlaubt, werden aber von keinem Werkzeug gelesen. Jeder
# zusätzliche Eintrag ist eine Kopie aus den Dokumenten - und Kopien driften.
