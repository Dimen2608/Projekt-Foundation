# Maschinenlesbarer Index der Foundation.
#
# WICHTIG: Diese Datei ist ein INDEX, niemals die Source of Truth.
# Bei Widersprüchen gewinnen immer die Dokumente (STATUS.md, docs/*).
#
# Kopieren nach .project-foundation.yml im Projektwurzelverzeichnis.

schema_version: 1

project:
  name: <projektname>
  type: <cli | web-app | api | library | service | data-pipeline | tool>
  maturity: <greenfield | prototype | active | maintenance>

stack:
  language: <python | typescript | go | ...>
  runtime: <z. B. python-3.11, node-22>
  package_manager: <pip | uv | pnpm | npm | cargo | ...>
  frameworks: []

architecture:
  style: <z. B. cli, modular-monolith, layered>
  persistence: <none | postgres | sqlite | ...>
  authentication: <none | session | oauth2 | ...>
  deployment: <none | container | managed-hosting | ...>

ai_support:
  claude_md: true
  agents_md: false
  cursor_rules: false
  skills: []

testing:
  # Nur Level nennen, die tatsächlich aktiv sind.
  levels: [unit]
  # Pflicht, sobald levels nicht leer ist - ein Test-Level ohne
  # ausführbaren Command ist keine Teststrategie.
  command: <z. B. pytest>

infrastructure:
  ci: <none | github-actions | gitlab-ci | ...>
  hosting: <none | ...>

quality_gates: [foundation, change, architecture, security]

foundation:
  status: <READY | NOT_READY>
  blocking_issues: 0
  warnings: 0
  last_audit: <YYYY-MM-DD>
