# Maschinenlesbarer Index der Foundation.
#
# WICHTIG: INDEX, niemals Source of Truth. Bei Widersprüchen gewinnen die
# Dokumente (STATUS.md, docs/*). Siehe ADR-0004.
#
# Nur was maschinell gebraucht wird. Stack, Architektur, Infrastruktur und
# Quality Gates stehen in docs/ARCHITECTURE.md und werden hier nicht kopiert
# (ADR-0011).

schema_version: 1

foundation:
  # Ergebnis des vollständigen Prozesses, nicht die Ausgabe des Validators (ADR-0010).
  status: READY
  blocking_issues: 0

project:
  name: projekt-foundation

ai_support:
  claude_md: true
  agents_md: true
  cursor_rules: true

testing:
  levels: [unit, integration]
  command: pytest
