name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Der Workflow liest nur. Ohne diesen Block bekaeme GITHUB_TOKEN die Repo-Default-
# Rechte, die Schreibzugriff einschliessen koennen - in einem oeffentlichen Repo mit
# Fork-PRs die falsche Voreinstellung.
permissions:
  contents: read

jobs:
  # Der Jobname ist der Status-Kontext, den der Branch-Schutz von main verlangt.
  # Keine Matrix: sie haengt "(ubuntu-latest)" an den Namen, der geforderte Kontext
  # "quality" existierte nicht mehr, und jeder PR waere dauerhaft blockiert.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest -q

      # Kein Build-Schritt: Das Projekt erzeugt kein Artefakt (ADR-0006).

  # Eigener Job statt Matrix, siehe oben. Windows ist drin, weil der Validator dort
  # schon einmal gar nicht lief (UnicodeEncodeError auf cp1252, ADR-0007) - der Job
  # weist nach, dass das ohne Sonderbehandlung im Code so bleibt.
  quality-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  foundation:
    runs-on: ubuntu-latest
    needs: [quality, quality-windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      # Das Toolkit prueft sich selbst und das mitgelieferte Beispiel.
      - name: Foundation Gate (Repository)
        run: foundation-validate .

      - name: Foundation Gate (Beispiel)
        run: foundation-validate examples/taskflow
