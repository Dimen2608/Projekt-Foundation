name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Der Workflow liest nur. Ohne diesen Block bekaeme GITHUB_TOKEN die Repo-Default-
# Rechte, die Schreibzugriff einschliessen koennen - in einem oeffentlichen Repo mit
# Fork-PRs die falsche Voreinstellung.
permissions:
  contents: read

jobs:
  quality:
    # Windows steht in der Matrix, weil der Validator dort schon einmal gar nicht lief
    # (UnicodeEncodeError auf cp1252, ADR-0007). Nur Tests, keine Sonderbehandlung im
    # Code - genau das soll der Job nachweisen.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest -q

      # Kein Build-Schritt: Das Projekt erzeugt kein Artefakt (ADR-0006).

  foundation:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      # Das Toolkit prueft sich selbst und das mitgelieferte Beispiel.
      - name: Foundation Gate (Repository)
        run: foundation-validate .

      - name: Foundation Gate (Beispiel)
        run: foundation-validate examples/taskflow
